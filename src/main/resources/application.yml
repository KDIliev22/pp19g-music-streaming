# Default profile: in-memory H2. Run with --spring.profiles.active=postgres for Postgres.
spring:
  datasource: { url: "jdbc:h2:mem:music;DB_CLOSE_DELAY=-1", username: sa, password: "" }
  jpa: { open-in-view: false, hibernate: { ddl-auto: update } }
  servlet.multipart: { max-file-size: 50MB, max-request-size: 50MB }
server.error.include-message: always
app.media-dir: ./media
